<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvdDex Console — AVD Digital Experience</title>
<style>
:root{
  --surface:#1a1a19;--panel:#222221;--panel-2:#2a2a28;--border:#363634;--border-2:#45453f;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8e86;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --good-bg:rgba(12,163,12,.16);--warn-bg:rgba(250,178,25,.16);--serious-bg:rgba(236,131,90,.18);--crit-bg:rgba(208,59,59,.2);
  --radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --surface:#fcfcfb;--panel:#ffffff;--panel-2:#f3f2ee;--border:#e2e1db;--border-2:#cfceC6;
  --text:#0b0b0b;--text-2:#52514e;--muted:#7a7972;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --good-bg:rgba(12,163,12,.12);--warn-bg:rgba(250,178,25,.18);--serious-bg:rgba(236,131,90,.18);--crit-bg:rgba(208,59,59,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--s1)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel-2);border:1px solid var(--border-2);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text-2)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.small{padding:3px 8px;font-size:12px}
select.btn,input.btn{cursor:auto}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.status{display:flex;gap:8px;align-items:center;color:var(--text-2);font-size:12px;margin-left:auto;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--good)} .dot.stale{background:var(--warn)} .dot.demo{background:var(--s7)}
nav{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--text-2);cursor:pointer;white-space:nowrap}
nav button.active{color:var(--text);border-bottom-color:var(--s1)}
nav button .n{background:var(--panel-2);border:1px solid var(--border-2);border-radius:10px;padding:0 6px;font-size:11px;margin-left:6px;color:var(--text-2)}
main{padding:14px;max-width:1800px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-height:78px}
.tile .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tile .value{font-size:26px;font-weight:650;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .sub{color:var(--text-2);font-size:12px;margin-top:4px}
.tile.good .value{color:var(--good)} .tile.warn .value{color:var(--warn)} .tile.crit .value{color:var(--crit)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.panel h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-weight:400;color:var(--muted);font-size:11px;margin-left:auto}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel-2);color:var(--text-2);font-weight:600;cursor:pointer;user-select:none;z-index:1}
th.sorted::after{content:" ▾";color:var(--s1)} th.sorted.asc::after{content:" ▴"}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right}
td.heat{border-left:3px solid transparent}
td.warn{background:var(--warn-bg);border-left-color:var(--warn)} td.serious{background:var(--serious-bg);border-left-color:var(--serious)} td.crit{background:var(--crit-bg);border-left-color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:1px 8px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.chip.Healthy{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.chip.Watch{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chip.Stressed{background:var(--serious-bg);color:var(--serious);border-color:var(--serious)}
.chip.Critical{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.chip.Stale,.chip.na{background:var(--panel-2);color:var(--muted);border-color:var(--border-2)}
.chip.critical{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)} .chip.warning{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)} .chip.info{background:rgba(57,135,229,.16);color:var(--s1);border-color:var(--s1)}
:root[data-theme="light"] .chip.Watch,:root[data-theme="light"] .chip.warning{color:#7a5300}
:root[data-theme="light"] .chip.Stressed{color:#9a4420}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;display:inline-block;width:70px;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
.bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)} .bar.serious i{background:var(--serious)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.list .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .meta{color:var(--muted);font-size:11.5px;white-space:nowrap}
.empty{color:var(--muted);padding:24px;text-align:center}
svg text{fill:var(--text-2);font-size:11px;font-family:inherit}
svg .grid line{stroke:var(--border);stroke-width:1}
svg .axis{stroke:var(--border-2)}
.chart{width:100%;height:220px;display:block}
.chart.tall{height:280px}
.spark{width:100%;height:46px;display:block}
.tooltip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--border-2);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:50;display:none;max-width:320px}
.tooltip b{color:var(--text)} .tooltip div{white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .2s;z-index:40;overflow:auto;padding:16px 18px;box-shadow:-12px 0 30px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.drawer h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drawer .close{position:absolute;top:10px;right:12px}
.drawer h4{margin:16px 0 6px;color:var(--text-2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:12.5px}
.kv div span{color:var(--muted);display:block;font-size:11px}
.factors{display:flex;flex-wrap:wrap;gap:6px}
.factors span{background:var(--serious-bg);border:1px solid var(--serious);color:var(--serious);border-radius:6px;padding:2px 8px;font-size:12px}
:root[data-theme="light"] .factors span{color:#9a4420}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.overlay.open{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seg{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--panel-2);gap:2px}
.seg div{height:100%;min-width:2px}
.dropzone{border:2px dashed var(--border-2);border-radius:var(--radius);padding:30px;text-align:center;color:var(--text-2);margin:40px auto;max-width:720px;background:var(--panel)}
.dropzone.hover{border-color:var(--s1)}
.dropzone h2{margin:0 0 8px;font-size:18px}
.dropzone p{margin:6px 0}
.dropzone .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mono{font-family:var(--mono);font-size:12px}
.sev-crit{color:var(--crit)} .sev-warn{color:var(--warn)} .sev-info{color:var(--s1)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--border-2);border-radius:12px;padding:2px 10px;cursor:pointer;color:var(--text-2);font-size:12px;background:var(--panel-2)}
.pill.on{border-color:var(--s1);color:var(--text)}
@media print{header,nav,.toolbar,.drawer,.overlay{display:none!important} main{padding:0} .panel{break-inside:avoid}}
@media (max-width:640px){header h1 span{display:none} .tile .value{font-size:22px} main{padding:10px}}
</style>
</head>
<body>
<header>
  <h1 id="brand">AvdDex Console <span>Digital Employee Experience for AVD / RDS</span></h1>
  <button class="btn" id="btnFolder" title="Point at the DEX share root (the folder containing latest\ and fleet.json). Re-reads automatically.">📁 Open DEX folder</button>
  <label class="btn" title="Load fleet.json / trends.json / latest\*.json">📄 Load files<input id="fileInput" type="file" multiple style="display:none"></label>
  <button class="btn" id="btnDemo">▶ Demo data</button>
  <button class="btn" id="btnRefresh" title="Re-read the data source">⟳</button>
  <label class="btn" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="autoRefresh" checked>auto 30s</label>
  <button class="btn" id="btnTheme" title="Toggle light/dark">◐</button>
  <div class="status"><span class="dot" id="srcDot"></span><span id="srcText">No data loaded</span><span id="ageText"></span></div>
</header>
<nav id="nav">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="hosts">Hosts <span class="n" id="nHosts">0</span></button>
  <button data-tab="sessions">Sessions <span class="n" id="nSessions">0</span></button>
  <button data-tab="alerts">Alerts <span class="n" id="nAlerts">0</span></button>
  <button data-tab="reports">Reports</button>
  <button data-tab="capacity">Capacity</button>
</nav>
<main id="main"></main>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="tooltip" id="tooltip"></div>

<script>
'use strict';
// ============================================================================================
// State
// ============================================================================================
const S = {
  fleet: null, trends: null, source: 'none', sourceLabel: '', dirHandle: null, tab: 'overview',
  pool: '', search: '', sort: { hosts: ['Score', 1], sessions: ['Score', 1] }, alertSev: { critical: true, warning: true, info: true },
  reportRange: 7, timer: null
};
const $ = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => Array.from(el.querySelectorAll(q));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString();
const n1 = v => (v == null || isNaN(v)) ? '—' : (Math.round(v * 10) / 10).toLocaleString();
const pct = v => v == null ? '—' : n0(v) + '%';
const ms = v => v == null ? '—' : n0(v) + ' ms';
const secs = v => v == null ? '—' : (v >= 60 ? Math.floor(v / 60) + 'm ' + Math.round(v % 60) + 's' : n0(v) + 's');
const gb = mb => mb == null ? '—' : (mb / 1024).toFixed(1) + ' GB';
const ago = iso => { if (!iso) return '—'; const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return Math.round(s) + 's ago'; if (s < 5400) return Math.round(s / 60) + 'm ago'; if (s < 172800) return (s / 3600).toFixed(1) + 'h ago'; return Math.round(s / 86400) + 'd ago'; };
const hours = h => h == null ? '—' : (h < 48 ? n0(h) + 'h' : (h / 24).toFixed(1) + 'd');
const stressOf = sc => sc == null ? 'na' : sc >= 80 ? 'Healthy' : sc >= 60 ? 'Watch' : sc >= 40 ? 'Stressed' : 'Critical';
const heat = (v, warn, crit, invert = false) => { if (v == null) return ''; if (invert) { if (v <= crit) return 'crit'; if (v <= warn) return 'warn'; return 'ok'; } if (v >= crit) return 'crit'; if (v >= warn) return 'warn'; return 'ok'; };
const chip = (score, stress) => `<span class="chip ${esc(stress || stressOf(score))}">${score == null ? '—' : Math.round(score)}<small style="font-weight:400">${esc(stress || stressOf(score))}</small></span>`;
const sevChip = s => `<span class="chip ${esc(s)}">${esc(s)}</span>`;
const T = { CpuWarn: 80, CpuCrit: 92, MemWarn: 85, MemCrit: 94, DLatWarn: 20, DLatCrit: 45, FreeWarn: 15, FreeCrit: 7, RttWarn: 120, RttCrit: 220, LagWarn: 400, LagCrit: 1000, LogonWarn: 45, LogonCrit: 90, SCpuWarn: 50, SCpuCrit: 85, GpuWarn: 85, GpuCrit: 97 };

// ============================================================================================
// Data loading
// ============================================================================================
function setSource(kind, label) { S.source = kind; S.sourceLabel = label; const d = $('#srcDot'); d.className = 'dot ' + (kind === 'demo' ? 'demo' : kind === 'none' ? '' : 'live'); $('#srcText').textContent = label; }
function updateAge() { const t = $('#ageText'); if (!S.fleet) { t.textContent = ''; return; } const a = (Date.now() - new Date(S.fleet.GeneratedAt)) / 1000; t.textContent = '· data ' + ago(S.fleet.GeneratedAt); $('#srcDot').className = 'dot ' + (S.source === 'demo' ? 'demo' : a > 600 ? 'stale' : 'live'); }

async function tryFetch() {
  if (location.protocol === 'file:') return false;
  try {
    const r = await fetch('fleet.json', { cache: 'no-store' }); if (!r.ok) return false;
    const fleet = await r.json(); let trends = null;
    try { const t = await fetch('trends.json', { cache: 'no-store' }); if (t.ok) trends = await t.json(); } catch (e) { }
    applyData(fleet, trends); setSource('http', 'fleet.json (served)'); return true;
  } catch (e) { return false; }
}

async function openFolder() {
  if (!window.showDirectoryPicker) { alert('Folder access needs Edge or Chrome. Use "Load files" instead.'); return; }
  try { S.dirHandle = await window.showDirectoryPicker({ mode: 'read' }); await readFolder(); } catch (e) { if (e.name !== 'AbortError') alert('Could not open folder: ' + e.message); }
}
async function readFolder() {
  const dir = S.dirHandle; if (!dir) return;
  const readJson = async (parent, name) => { try { const fh = await parent.getFileHandle(name); return JSON.parse(await (await fh.getFile()).text()); } catch (e) { return null; } };
  let fleet = await readJson(dir, 'fleet.json'); const trends = await readJson(dir, 'trends.json');
  if (!fleet) {
    // No merge output yet - build the fleet view straight from latest\*.json
    const snaps = [];
    try { const latest = await dir.getDirectoryHandle('latest'); for await (const [name, h] of latest.entries()) { if (name.endsWith('.json') && h.kind === 'file') { try { snaps.push(JSON.parse(await (await h.getFile()).text())); } catch (e) { } } } } catch (e) { }
    if (!snaps.length) { alert('No fleet.json and no latest\\*.json found in that folder. Point at the DEX share root.'); return; }
    fleet = buildFleet(snaps);
  }
  applyData(fleet, trends); setSource('folder', 'Folder: ' + dir.name);
}

async function loadFiles(files) {
  let fleet = null, trends = null; const snaps = [];
  for (const f of files) {
    try { const j = JSON.parse(await f.text()); if (j && j.Hosts && j.Summary) fleet = j; else if (j && j.Hourly) trends = j; else if (j && j.Host && j.Metrics) snaps.push(j); } catch (e) { }
  }
  if (!fleet && snaps.length) fleet = buildFleet(snaps);
  if (!fleet) { alert('Nothing usable in those files. Drop fleet.json, trends.json, or host snapshots from latest\\.'); return; }
  applyData(fleet, trends); setSource('files', files.length + ' file(s)');
}

// Client-side equivalent of Merge-AvdDexFleet.ps1's summary (used when only agent output exists)
function buildFleet(snaps, staleMin = 5) {
  const now = Date.now();
  snaps.forEach(s => { s.AgeSeconds = Math.round((now - new Date(s.Timestamp)) / 1000); s.Stale = s.AgeSeconds > staleMin * 60; });
  const online = snaps.filter(s => !s.Stale), sessions = online.flatMap(h => h.Sessions || []), active = sessions.filter(s => s.State === 'Active');
  const alerts = online.flatMap(h => (h.Alerts || []).map(a => ({ ...a, Host: h.Host, HostPool: h.HostPool })));
  const stress = { Healthy: 0, Watch: 0, Stressed: 0, Critical: 0 }; online.forEach(h => { if (stress[h.Score.Stress] != null) stress[h.Score.Stress]++; });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {
    SchemaVersion: 1, GeneratedAt: new Date(now).toISOString(), GeneratedBy: 'dashboard', StaleMinutes: staleMin,
    Summary: { Hosts: snaps.length, Online: online.length, Stale: snaps.length - online.length, Sessions: sessions.length, ActiveSessions: active.length, DisconnectedSessions: sessions.length - active.length,
      AvgHostScore: avg(online.map(h => h.Score.Score)), AvgSessionScore: avg(active.map(s => s.Score.Score)), Stress: stress,
      Alerts: { critical: alerts.filter(a => a.Severity === 'critical').length, warning: alerts.filter(a => a.Severity === 'warning').length, info: alerts.filter(a => a.Severity === 'info').length },
      Pools: [...new Set(snaps.map(s => s.HostPool).filter(Boolean))].sort() },
    Hosts: snaps.sort((a, b) => a.Host.localeCompare(b.Host)), RightSizing: []
  };
}

function applyData(fleet, trends) {
  S.fleet = fleet; S.trends = trends || S.trends;
  $('#brand').innerHTML = `${esc(fleet.OrgName ? fleet.OrgName + ' · ' : '')}AvdDex Console <span>Digital Employee Experience for AVD / RDS</span>`; document.title = (fleet.OrgName ? fleet.OrgName + ' · ' : '') + 'AvdDex Console';
  // normalise: every alert carries Host/HostPool; every session carries host refs
  fleet.Hosts.forEach(h => { (h.Alerts || []).forEach(a => { a.Host = h.Host; a.HostPool = h.HostPool; }); (h.Sessions || []).forEach(s => { s._host = h.Host; s._pool = h.HostPool; s._hostScore = h.Score.Score; s._stale = h.Stale; }); });
  render();
}

async function refresh() {
  if (S.source === 'folder') await readFolder();
  else if (S.source === 'http') await tryFetch();
  else if (S.source === 'demo') { applyData(...demoData()); }
  updateAge();
}

// ============================================================================================
// Derived views
// ============================================================================================
const hostsView = () => (S.fleet?.Hosts || []).filter(h => (!S.pool || h.HostPool === S.pool) && (!S.search || h.Host.toLowerCase().includes(S.search)));
const sessionsView = () => hostsView().flatMap(h => h.Sessions || []).filter(s => !S.search || (s.UserName || '').toLowerCase().includes(S.search) || s._host.toLowerCase().includes(S.search));
const alertsView = () => hostsView().filter(h => !h.Stale).flatMap(h => h.Alerts || []).filter(a => S.alertSev[a.Severity] && (!S.search || (a.Target + a.Message).toLowerCase().includes(S.search)));
const sevRank = { critical: 0, warning: 1, info: 2 };

// ============================================================================================
// Rendering
// ============================================================================================
function render() {
  if (!S.fleet) { $('#main').innerHTML = landing(); wireLanding(); return; }
  const f = S.fleet;
  $('#nHosts').textContent = f.Hosts.length; $('#nSessions').textContent = f.Summary.Sessions; $('#nAlerts').textContent = f.Summary.Alerts.critical + f.Summary.Alerts.warning;
  $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  const m = $('#main');
  m.innerHTML = toolbar() + ({ overview: overview, hosts: hostsTab, sessions: sessionsTab, alerts: alertsTab, reports: reportsTab, capacity: capacityTab }[S.tab])();
  wireToolbar(); wireTables(); drawCharts();
  updateAge();
}

function landing() {
  return `<div class="dropzone" id="drop">
    <h2>AvdDex Console</h2>
    <p>Real-time host &amp; session experience for your AVD / RDS estate — ControlUp-style, with no credentials in the browser.</p>
    <p class="mono" style="color:var(--muted)">Reads <b>fleet.json</b> / <b>trends.json</b> written by Merge-AvdDexFleet.ps1, or the raw <b>latest\\*.json</b> snapshots from the agents.</p>
    <div class="actions"><button class="btn primary" onclick="openFolder()">📁 Open the DEX share folder</button><label class="btn">📄 Load files<input type="file" multiple onchange="loadFiles(this.files)" style="display:none"></label><button class="btn" onclick="startDemo()">▶ Explore with demo data</button></div>
    <p style="margin-top:14px;color:var(--muted)">…or drag fleet.json / snapshot files anywhere on this page.</p>
  </div>`;
}
function wireLanding() { }

function toolbar() {
  const pools = S.fleet.Summary.Pools || [];
  const poolSel = `<select class="btn" id="poolSel"><option value="">All host pools (${S.fleet.Hosts.length})</option>${pools.map(p => `<option ${S.pool === p ? 'selected' : ''} value="${esc(p)}">${esc(p)} (${S.fleet.Hosts.filter(h => h.HostPool === p).length})</option>`).join('')}</select>`;
  const search = `<input class="btn" id="search" placeholder="Filter host / user…" value="${esc(S.search)}" style="min-width:180px">`;
  let extra = '';
  if (S.tab === 'alerts') extra = `<div class="pill-row">${['critical', 'warning', 'info'].map(s => `<span class="pill ${S.alertSev[s] ? 'on' : ''}" data-sev="${s}">${s}</span>`).join('')}</div>`;
  if (S.tab === 'reports') extra = `<div class="pill-row">${[1, 7, 30, 90].map(d => `<span class="pill ${S.reportRange === d ? 'on' : ''}" data-range="${d}">${d === 1 ? '24h' : d + 'd'}</span>`).join('')}</div><button class="btn small" onclick="window.print()">🖨 Print / PDF</button>`;
  if (S.tab === 'hosts') extra = `<button class="btn small" onclick="exportCsv('hosts')">⬇ CSV</button>`;
  if (S.tab === 'sessions') extra = `<button class="btn small" onclick="exportCsv('sessions')">⬇ CSV</button>`;
  if (S.tab === 'alerts') extra += `<button class="btn small" onclick="exportCsv('alerts')">⬇ CSV</button>`;
  return `<div class="toolbar">${poolSel}${search}<div class="spacer"></div>${extra}</div>`;
}
function wireToolbar() {
  $('#poolSel')?.addEventListener('change', e => { S.pool = e.target.value; render(); });
  const si = $('#search'); if (si) { si.addEventListener('input', e => { S.search = e.target.value.trim().toLowerCase(); render(); const el = $('#search'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }); }
  $$('[data-sev]').forEach(p => p.onclick = () => { S.alertSev[p.dataset.sev] = !S.alertSev[p.dataset.sev]; render(); });
  $$('[data-range]').forEach(p => p.onclick = () => { S.reportRange = +p.dataset.range; render(); });
}

// ---------------------------------------------------------------- Overview
function overview() {
  const f = S.fleet, hs = hostsView(), online = hs.filter(h => !h.Stale), sess = sessionsView(), act = sess.filter(s => s.State === 'Active'), al = online.flatMap(h => h.Alerts || []);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const hostScore = avg(online.map(h => h.Score.Score)), sessScore = avg(act.map(s => s.Score.Score));
  const crit = al.filter(a => a.Severity === 'critical').length, warn = al.filter(a => a.Severity === 'warning').length;
  const stressed = online.filter(h => h.Score.Score < 60).length, stale = hs.length - online.length;
  const cls = v => v == null ? '' : v >= 80 ? 'good' : v >= 60 ? 'warn' : 'crit';
  const byId = {}; al.forEach(a => { (byId[a.Id] ||= { id: a.Id, n: 0, sev: a.Severity, targets: new Set(), fix: a.Remediation }).n++; byId[a.Id].targets.add(a.Target); });
  const issues = Object.values(byId).sort((a, b) => sevRank[a.sev] - sevRank[b.sev] || b.n - a.n).slice(0, 8);
  const worstHosts = [...online].sort((a, b) => a.Score.Score - b.Score.Score).slice(0, 6);
  const worstSess = [...act].sort((a, b) => a.Score.Score - b.Score.Score).slice(0, 6);
  const dist = ['Healthy', 'Watch', 'Stressed', 'Critical'].map(k => ({ k, n: online.filter(h => h.Score.Stress === k).length }));
  const sDist = ['Healthy', 'Watch', 'Stressed', 'Critical'].map(k => ({ k, n: act.filter(s => s.Score.Stress === k).length }));
  const slowLogons = act.filter(s => s.Logon?.TotalSec != null).sort((a, b) => b.Logon.TotalSec - a.Logon.TotalSec).slice(0, 5);
  return `
  <div class="grid kpis" style="margin-bottom:12px">
    <div class="tile ${cls(hostScore)}"><div class="label">Fleet DEX score</div><div class="value">${n0(hostScore)}</div><div class="sub">${esc(stressOf(hostScore))} · ${online.length} host${online.length === 1 ? '' : 's'} online</div></div>
    <div class="tile ${cls(sessScore)}"><div class="label">Session experience</div><div class="value">${n0(sessScore)}</div><div class="sub">${act.length} active · ${sess.length - act.length} disconnected</div></div>
    <div class="tile ${crit ? 'crit' : warn ? 'warn' : 'good'}"><div class="label">Open alerts</div><div class="value">${crit + warn}</div><div class="sub"><span class="sev-crit">${crit} critical</span> · <span class="sev-warn">${warn} warning</span></div></div>
    <div class="tile ${stressed ? 'warn' : 'good'}"><div class="label">Hosts under stress</div><div class="value">${stressed}</div><div class="sub">score &lt; 60</div></div>
    <div class="tile ${stale ? 'warn' : ''}"><div class="label">Stale / offline</div><div class="value">${stale}</div><div class="sub">no sample in ${f.StaleMinutes || 5} min</div></div>
    <div class="tile"><div class="label">Sessions / host</div><div class="value">${online.length ? n1(sess.length / online.length) : '—'}</div><div class="sub">peak ${n0(Math.max(0, ...online.map(h => h.SessionSummary?.Total || 0)))} on one host</div></div>
  </div>
  <div class="grid cols-3" style="margin-bottom:12px">
    <div class="panel"><h3>DEX score — last 24h <span class="hint">hourly fleet average</span></h3><svg class="chart" id="chFleetTrend"></svg><div class="legend"><span><i style="background:var(--s1)"></i>Host score</span><span><i style="background:var(--s3)"></i>Session score</span></div></div>
    <div class="panel"><h3>Active sessions — last 24h <span class="hint">peak per hour, fleet</span></h3><svg class="chart" id="chSessTrend"></svg></div>
    <div class="panel"><h3>Logon duration — last 24h <span class="hint">p95 seconds per hour</span></h3><svg class="chart" id="chLogonTrend"></svg></div>
  </div>
  <div class="grid cols-3">
    <div class="panel"><h3>Top issues <span class="hint">grouped by rule</span></h3>${issues.length ? `<ul class="list">${issues.map(i => `<li>${sevChip(i.sev)}<span class="msg" title="${esc(i.fix)}">${esc(i.id.replace(/_/g, ' '))}</span><span class="meta">${i.n} · ${i.targets.size} target${i.targets.size === 1 ? '' : 's'}</span></li>`).join('')}</ul>` : '<div class="empty">No open alerts 🎉</div>'}</div>
    <div class="panel"><h3>Host stress distribution</h3>${distBar(dist, online.length)}<h3 style="margin-top:14px">Session stress distribution</h3>${distBar(sDist, act.length)}</div>
    <div class="panel"><h3>Worst hosts</h3><ul class="list">${worstHosts.map(h => `<li data-host="${esc(h.Host)}">${chip(h.Score.Score, h.Score.Stress)}<span class="msg"><b>${esc(h.Host)}</b> <span class="meta">${esc((h.Score.Factors || []).slice(0, 2).join(' · ') || 'no issues')}</span></span><span class="meta">${h.SessionSummary?.Active ?? 0} act</span></li>`).join('') || '<li class="empty">—</li>'}</ul></div>
    <div class="panel"><h3>Worst sessions</h3><ul class="list">${worstSess.map(s => `<li data-session="${esc(s._host)}|${s.SessionId}">${chip(s.Score.Score, s.Score.Stress)}<span class="msg"><b>${esc(s.UserName)}</b> <span class="meta">${esc(s._host)} · ${esc((s.Score.Factors || []).slice(0, 2).join(' · ') || 'no issues')}</span></span></li>`).join('') || '<li class="empty">—</li>'}</ul></div>
    <div class="panel"><h3>Slowest logons (current sessions)</h3><ul class="list">${slowLogons.map(s => `<li data-session="${esc(s._host)}|${s.SessionId}"><span class="mono" style="min-width:52px;text-align:right;color:${s.Logon.TotalSec >= T.LogonCrit ? 'var(--crit)' : s.Logon.TotalSec >= T.LogonWarn ? 'var(--warn)' : 'var(--text)'}">${secs(s.Logon.TotalSec)}</span><span class="msg"><b>${esc(s.UserName)}</b> <span class="meta">${esc(s._host)}</span></span><span class="meta">prof ${secs(s.Logon.ProfileLoadSec)} · gpo ${secs(s.Logon.GpoSec)}</span></li>`).join('') || '<li class="empty">no logon data yet</li>'}</ul></div>
    <div class="panel"><h3>Infrastructure health</h3><ul class="list">
      <li><span class="msg">AVD agent healthy</span><span class="meta">${online.filter(h => h.AvdAgent?.Healthy).length} / ${online.length}</span></li>
      <li><span class="msg">FSLogix service running</span><span class="meta">${online.filter(h => h.FsLogix?.Installed && h.FsLogix.ServiceStatus === 'Running').length} / ${online.filter(h => h.FsLogix?.Installed).length} installed</span></li>
      <li><span class="msg">Pending reboot</span><span class="meta">${online.filter(h => h.Metrics?.PendingReboot).length}</span></li>
      <li><span class="msg">UDP Shortpath in use (active sessions)</span><span class="meta">${act.filter(s => (s.Transport || '').startsWith('UDP')).length} / ${act.length}</span></li>
      <li><span class="msg">Input-delay counters enabled</span><span class="meta">${online.filter(h => h.Capabilities?.InputDelayCounters).length} / ${online.length}</span></li>
      <li><span class="msg">GPU hosts</span><span class="meta">${online.filter(h => h.Metrics?.Gpu).length}</span></li>
    </ul></div>
  </div>`;
}
function distBar(d, total) {
  const col = { Healthy: 'var(--good)', Watch: 'var(--warn)', Stressed: 'var(--serious)', Critical: 'var(--crit)' };
  return `<div class="seg">${d.filter(x => x.n).map(x => `<div style="width:${(x.n / (total || 1)) * 100}%;background:${col[x.k]}" title="${x.k}: ${x.n}"></div>`).join('') || '<div style="width:100%;background:var(--panel-2)"></div>'}</div><div class="legend">${d.map(x => `<span><i style="background:${col[x.k]}"></i>${x.k} ${x.n}</span>`).join('')}</div>`;
}

const bar = (v, w, c) => `<span class="bar ${heat(v, w, c) === 'crit' ? 'crit' : heat(v, w, c) === 'warn' ? 'warn' : ''}"><i style="width:${Math.min(100, v || 0)}%"></i></span>`;
function hostsTab() { return table('hosts', hostCols, hostsView(), h => `data-host="${esc(h.Host)}"`); }
function table(name, cols, rows, attr) {
  const [sk, dir] = S.sort[name];
  const col = cols.find(c => c.k === sk);
  if (col) rows = [...rows].sort((a, b) => { const x = col.v(a), y = col.v(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  return `<div class="tablewrap"><table data-table="${name}"><thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${c.num ? 'num ' : ''}${c.k === sk ? 'sorted ' + (dir > 0 ? 'asc' : '') : ''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr ${attr(r)}>${cols.map(c => `<td class="${c.num ? 'num ' : ''}${c.heat ? 'heat ' + c.heat(r) : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">Nothing matches</td></tr>`}</tbody></table></div>`;
}
function wireTables() {
  $$('table[data-table] th').forEach(th => th.onclick = () => { const t = th.closest('table').dataset.table; const [k, d] = S.sort[t]; S.sort[t] = [th.dataset.k, k === th.dataset.k ? -d : (th.dataset.k === 'Host' || th.dataset.k === 'User' ? 1 : -1)]; render(); });
  $$('[data-host]').forEach(el => el.onclick = () => openHost(el.dataset.host));
  $$('[data-session]').forEach(el => el.onclick = () => { const [h, id] = el.dataset.session.split('|'); openSession(h, +id); });
}

// ---------------------------------------------------------------- Alerts
function alertsTab() {
  const al = alertsView().sort((a, b) => sevRank[a.Severity] - sevRank[b.Severity] || a.Host.localeCompare(b.Host));
  const hist = (S.trends?.AlertHistory || []).filter(a => !S.pool || a.pool === S.pool);
  const days = {}; hist.forEach(a => { const d = (a.t || '').slice(0, 10); (days[d] ||= { critical: 0, warning: 0, info: 0 })[a.sev] = ((days[d] || {})[a.sev] || 0) + 1; });
  const dk = Object.keys(days).sort();
  return `<div class="grid cols-2" style="margin-bottom:12px">
    <div class="panel"><h3>Alert history <span class="hint">new alerts per day · last ${S.trends?.TrendDays || 7}d</span></h3>${dk.length ? `<svg class="chart" id="chAlertHist"></svg><div class="legend"><span><i style="background:var(--crit)"></i>critical</span><span><i style="background:var(--warn)"></i>warning</span><span><i style="background:var(--s1)"></i>info</span></div>` : '<div class="empty">No alert history yet (written by Merge-AvdDexFleet.ps1)</div>'}</div>
    <div class="panel"><h3>Most frequent rules <span class="hint">history</span></h3>${(() => { const by = {}; hist.forEach(a => by[a.id] = (by[a.id] || 0) + 1); const e = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 8); const mx = e[0]?.[1] || 1; return e.length ? `<ul class="list">${e.map(([k, n]) => `<li><span class="bar" style="width:120px"><i style="width:${n / mx * 100}%"></i></span><span class="msg">${esc(k.replace(/_/g, ' '))}</span><span class="meta">${n}</span></li>`).join('')}</ul>` : '<div class="empty">—</div>'; })()}</div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Severity</th><th>Rule</th><th>Target</th><th>Pool</th><th>Message</th><th class="num">Value</th><th class="num">Threshold</th><th>Suggested remediation</th><th>Since</th></tr></thead><tbody>
  ${al.map(a => `<tr ${a.Scope === 'session' ? `data-session="${esc(a.Host)}|${esc(sessionIdFor(a))}"` : `data-host="${esc(a.Host)}"`}><td>${sevChip(a.Severity)}</td><td class="mono">${esc(a.Id)}</td><td><b>${esc(a.Target)}</b></td><td>${esc(a.HostPool || '—')}</td><td style="white-space:normal;min-width:260px">${esc(a.Message)}</td><td class="num">${esc(fmtVal(a.Value))}</td><td class="num">${esc(fmtVal(a.Threshold))}</td><td style="white-space:normal;min-width:220px;color:var(--text-2)">${esc(a.Remediation || '')}</td><td>${ago(a.Time)}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">No open alerts for this filter</td></tr>'}
  </tbody></table></div>`;
}
const fmtVal = v => v == null ? '' : typeof v === 'number' ? (Math.round(v * 10) / 10) : String(v);
function sessionIdFor(a) { const h = S.fleet.Hosts.find(x => x.Host === a.Host); const u = a.Target.split('@')[0]; const s = (h?.Sessions || []).find(x => x.UserName === u); return s ? s.SessionId : ''; }

// ---------------------------------------------------------------- Reports
function reportsTab() {
  const tr = S.trends;
  if (!tr) return `<div class="empty">Reports need trends.json from Merge-AvdDexFleet.ps1 (or load demo data).</div>`;
  const range = S.reportRange, hostsSel = hostsView().map(h => h.Host);
  const daily = Object.entries(tr.Daily || {}).filter(([h]) => hostsSel.includes(h)).flatMap(([h, arr]) => arr.map(d => ({ ...d, host: h })));
  const dayKeys = [...new Set(daily.map(d => d.d))].sort().slice(-range);
  const logons = (tr.Logons || []).filter(l => hostsSel.includes(l.host) && (Date.now() - new Date(l.t)) / 864e5 <= range);
  const slow = [...logons].sort((a, b) => b.lg - a.lg).slice(0, 12);
  const apps = (tr.Apps || []).slice(0, 12);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null, p95 = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.ceil(.95 * s.length) - 1)]; };
  const perUser = {}; logons.forEach(l => (perUser[l.u] ||= []).push(l.lg));
  const users = Object.entries(perUser).map(([u, a]) => ({ u, n: a.length, avg: avg(a), p95: p95(a) })).sort((a, b) => b.p95 - a.p95).slice(0, 12);
  const cutoff = Date.now() - range * 864e5;
  const hostsByScore = Object.entries(tr.Hourly || {}).filter(([h]) => hostsSel.includes(h)).map(([h, arr]) => { const w = arr.filter(x => new Date(x.t) >= cutoff); return { h, score: avg(w.map(x => x.scoreAvg).filter(x => x != null)), cpu: p95(w.map(x => x.cpuP95).filter(x => x != null)), mem: p95(w.map(x => x.memP95).filter(x => x != null)), sess: Math.max(0, ...w.map(x => x.sessMax || 0)), alerts: w.reduce((s, x) => s + (x.alerts || 0), 0), n: w.length }; }).filter(x => x.n).sort((a, b) => (a.score ?? 101) - (b.score ?? 101));

  </div>

    <div class="panel"><h3>Application usage <span class="hint">foreground-CPU minutes, last ${tr.TrendDays || 7}d</span></h3><svg class="chart tall" id="chApps"></svg></div>
    <div class="panel"><h3>Host scorecard <span class="hint">last ${range === 1 ? '24h' : range + 'd'}</span><button class="btn small" style="margin-left:8px" onclick="exportCsv('scorecard')">⬇ CSV</button></h3><div class="tablewrap" style="border:0"><table id="scorecard"><thead><tr><th>Host</th><th class="num">Avg DEX</th><th class="num">CPU p95</th><th class="num">Mem p95</th><th class="num">Peak sess</th><th class="num">Alerts</th></tr></thead><tbody>${hostsByScore.map(x => `<tr data-host="${esc(x.h)}"><td><b>${esc(x.h)}</b></td><td class="num">${chip(x.score)}</td><td class="num heat ${heat(x.cpu, T.CpuWarn, T.CpuCrit)}">${pct(x.cpu)}</td><td class="num heat ${heat(x.mem, T.MemWarn, T.MemCrit)}">${pct(x.mem)}</td><td class="num">${x.sess}</td><td class="num">${x.alerts}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">—</td></tr>'}</tbody></table></div></div>
  </div>

function openSession(hostName, id) {
  const h = S.fleet.Hosts.find(x => x.Host === hostName); const s = h?.Sessions?.find(x => x.SessionId === id); if (!s) return;
  const lg = s.Logon || {}; const parts = [['Profile load', lg.ProfileLoadSec, 'var(--s1)'], ['Group Policy', lg.GpoSec, 'var(--s2)'], ['FSLogix attach', lg.FsLogixSec, 'var(--s3)'], ['Shell / other', lg.ShellSec, 'var(--s4)']].filter(p => p[1] != null && p[1] > 0);
  const known = parts.reduce((a, p) => a + p[1], 0), total = lg.TotalSec || known;
  const kv = [['Host', `${h.Host} (${h.HostPool || '—'})`], ['Session', `#${s.SessionId} · ${s.SessionName || ''} · ${s.State}`], ['Idle', s.IdleMinutes + ' min'], ['Logged on', s.LogonTime ? new Date(s.LogonTime).toLocaleString() : '—'], ['Transport', s.Transport || '—'], ['RTT', `${ms(s.RttMs)} (TCP ${ms(s.TcpRttMs)} · UDP ${ms(s.UdpRttMs)})`], ['Bandwidth', s.BandwidthKbps == null ? '—' : n0(s.BandwidthKbps) + ' kb/s avail · sending ' + n0(s.SentKbps) + ' kb/s'], ['Loss', s.LossRate == null ? '—' : n1(s.LossRate) + '%'], ['Input delay', `max ${ms(s.InputDelayMaxMs)} · avg ${ms(s.InputDelayAvgMs)}`], ['Graphics', `${n0(s.OutputFps)} fps out / ${n0(s.InputFps)} in · encode ${ms(s.EncodingTimeMs)}`], ['Frames skipped', `server ${n1(s.FramesSkippedServer)} · network ${n1(s.FramesSkippedNetwork)} · client ${n1(s.FramesSkippedClient)} /s`], ['CPU / memory', `${pct(s.CpuPct)} of host · ${gb(s.MemoryMB)} · ${s.ProcessCount} processes`], ['FSLogix', s.FsLogix?.Attached ? `attached · ${s.FsLogix.VhdPath || s.FsLogix.ProfilePath || ''}` : 'local profile'], ['SID', s.Sid || '—']];
  openDrawer(`<h2>${esc(s.UserName)} ${chip(s.Score.Score, s.Score.Stress)}</h2><div style="color:var(--text-2)">on <a href="#" onclick="openHost('${esc(h.Host)}');return false">${esc(h.Host)}</a> ${chip(h.Score.Score, h.Score.Stress)}</div>
  ${(s.Score.Factors || []).length ? `<h4>Why this score</h4><div class="factors">${s.Score.Factors.map(f => `<span>${esc(f)}</span>`).join('')}</div>` : ''}
  <h4>Logon breakdown — ${secs(lg.TotalSec)} <span style="font-weight:400;text-transform:none;color:var(--muted)">(${esc(lg.Method || 'n/a')})</span></h4>
  ${total ? `<div class="seg">${parts.map(p => `<div style="width:${p[1] / total * 100}%;background:${p[2]}" title="${p[0]}: ${secs(p[1])}"></div>`).join('')}${known < total ? `<div style="width:${(total - known) / total * 100}%;background:var(--border-2)" title="unattributed"></div>` : ''}</div><div class="legend">${parts.map(p => `<span><i style="background:${p[2]}"></i>${p[0]} ${secs(p[1])}</span>`).join('')}${known < total ? `<span><i style="background:var(--border-2)"></i>unattributed ${secs(total - known)}</span>` : ''}</div><div class="meta" style="margin-top:4px;color:var(--muted)">Profile and FSLogix phases overlap; GPO runs in parallel with profile load. Segments show measured spans, not a strict sequence.</div>` : '<div class="meta">no logon timing captured for this session</div>'}
  <h4>Details</h4><div class="kv">${kv.map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join('')}</div>
  <h4>Top processes</h4><div class="tablewrap"><table><thead><tr><th>Process</th><th class="num">PID</th><th class="num">CPU</th><th class="num">Memory</th><th>State</th></tr></thead><tbody>${(s.TopProcesses || []).map(p => `<tr style="cursor:default"><td class="mono">${esc(p.Name)}</td><td class="num">${p.Pid}</td><td class="num heat ${heat(p.CpuPct, 25, 50)}">${pct(p.CpuPct)}</td><td class="num">${n0(p.WorkingSetMB)} MB</td><td>${p.Responding === false ? '<span class="sev-crit">not responding</span>' : '<span style="color:var(--muted)">ok</span>'}</td></tr>`).join('')}</tbody></table></div>
  <h4>Alerts for this session</h4>${(() => { const al = (h.Alerts || []).filter(a => a.Target === `${s.UserName}@${h.Host}`); return al.length ? `<ul class="list">${al.map(a => `<li>${sevChip(a.Severity)}<span class="msg" style="white-space:normal">${esc(a.Message)}<div class="meta">↳ ${esc(a.Remediation || '')}</div></span></li>`).join('')}</ul>` : '<div class="meta">none</div>'; })()}`);

// ============================================================================================
// Charts - dependency-free SVG with hover
// ============================================================================================
const tip = $('#tooltip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const w = tip.offsetWidth, hgt = tip.offsetHeight; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 14) + 'px'; tip.style.top = Math.min(window.innerHeight - hgt - 8, e.clientY + 14) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
const svgNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function chartBox(svg) { const r = svg.getBoundingClientRect(); const W = Math.max(200, r.width || 400), H = Math.max(120, r.height || 220); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = ''; return { W, H, p: { l: 40, r: 12, t: 10, b: 24 } }; }
function niceMax(v) { if (!v || v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 3 ? 3 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 6 ? 6 : n <= 8 ? 8 : 10; return m * p; }
function yAxis(svg, b, max, fmt = v => n0(v)) { const g = el('g', { class: 'grid' }, svg); for (let i = 0; i <= 4; i++) { const y = b.p.t + (b.H - b.p.t - b.p.b) * (1 - i / 4); el('line', { x1: b.p.l, x2: b.W - b.p.r, y1: y, y2: y }, g); const t = el('text', { x: b.p.l - 6, y: y + 4, 'text-anchor': 'end' }, svg); t.textContent = fmt(max * i / 4); } }
// Multi-series line/bar chart over categorical x. series: [{name,data:[..],color,type:'line'|'bar'}]
function lineChart(svg, labels, series, { ymax, fmt, xfmt } = {}) {
  const b = chartBox(svg); const n = labels.length; if (!n) { const t = el('text', { x: b.W / 2, y: b.H / 2, 'text-anchor': 'middle' }, svg); t.textContent = 'no data'; return; }
  const max = ymax || niceMax(Math.max(1, ...series.flatMap(s => s.data.filter(v => v != null)))); yAxis(svg, b, max, fmt);
  const iw = b.W - b.p.l - b.p.r, ih = b.H - b.p.t - b.p.b, x = i => b.p.l + (i + 0.5) * iw / n, y = v => b.p.t + ih * (1 - Math.min(v, max) / max);
  const bars = series.filter(s => s.type === 'bar'); const bw = Math.max(2, iw / n * 0.6 / (bars.length || 1));
  bars.forEach((s, bi) => s.data.forEach((v, i) => { if (v == null) return; const h = ih * Math.min(v, max) / max; el('rect', { x: x(i) - bw * bars.length / 2 + bi * bw + 1, y: y(v), width: Math.max(1, bw - 2), height: h, fill: s.color, rx: 2 }, svg); }));
  series.filter(s => s.type !== 'bar').forEach(s => { let d = ''; s.data.forEach((v, i) => { if (v == null) { d += ' '; return; } d += (d.endsWith(' ') || !d ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }); el('path', { d: d.trim(), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg); });
  const step = Math.max(1, Math.ceil(n / Math.floor(iw / 60)));
  labels.forEach((l, i) => { if (i % step) return; const t = el('text', { x: x(i), y: b.H - 6, 'text-anchor': 'middle' }, svg); t.textContent = xfmt ? xfmt(l) : l; });
